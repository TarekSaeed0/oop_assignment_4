<div class="fixed inset-0 bg-black/30 z-20" aria-hidden="true"></div>

<div
  id="contact-menu"
  class="max-w-6xl mx-auto p-6 space-y-4 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-white border border-gray-200 rounded-lg shadow-lg z-30"
>
  <div
    class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-xl border border-gray-200"
  >
    <!-- Search -->
    <div class="relative">
      <button
        title="Search contacts"
        class="absolute left-1.75 top-1/2 transform -translate-y-1/2 p-1.25 rounded-full text-gray-700 hover:bg-gray-100 active:bg-gray-200 focus:outline-none transition-colors duration-400 cursor-pointer"
        aria-label="Search"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
      </button>
      <input
        type="search"
        [value]="searchTerm()"
        (input)="onSearchChange($event)"
        placeholder="Search contacts"
        class="w-full pr-4 pl-10 py-2 border border-gray-300 rounded-full outline-none focus:border-green-500 placeholder-gray-500 text-gray-800 transition-colors"
      />
    </div>

    <!-- Actions -->
    <div class="flex gap-2">
      <button
        (click)="toggleSort()"
        class="px-4 py-2 rounded-lg border border-gray-200 text-sm font-medium hover:bg-gray-100"
      >
        {{ isSorted() ? 'Original Order' : 'Sort A–Z' }}
      </button>

      <button
        (click)="toggleForm()"
        class="bg-green-500 hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-bold py-2 px-4 rounded-md transition duration-150 ease-in-out cursor-pointer"
      >
        {{ showForm() ? 'Close' : 'New Contact' }}
      </button>
    </div>
  </div>

  @if (showForm()) {
    <div class="bg-white border border-gray-200 rounded-xl p-6 space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">
        {{ isEdit() ? 'Edit Contact' : 'Create Contact' }}
      </h2>

      <!-- Name -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Name</label>
        <input
          type="text"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
          class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Email Input -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
        <div class="flex gap-2">
          <input
            type="text"
            [value]="emailInput()"
            (input)="emailInput.set($any($event.target).value)"
            class="flex-1 px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500"
          />
          <button (click)="addEmail()" class="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200">
            Add
          </button>
        </div>
      </div>

      <div class="flex flex-wrap gap-2">
        @for (e of emailList(); track $index) {
          <span
            class="flex items-center bg-green-100 text-green-800 text-xs font-medium px-2 py-1 rounded-full mb-1"
          >
            {{ e }}
            <button
              (click)="removeEmail($index)"
              class="ml-1 text-green-600 hover:text-green-900 focus:outline-none leading-none"
              title="Remove email"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="3"
                stroke="currentColor"
                class="size-3"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            </button>
          </span>
        }
      </div>

      <!-- Form Actions -->
      <div class="flex justify-end gap-3 pt-4">
        <button
          (click)="resetForm()"
          class="px-4 py-2 rounded-lg text-sm border border-gray-200 hover:bg-gray-100"
        >
          Reset
        </button>
        <button
          (click)="saveContact()"
          class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-bold text-sm cursor-pointer"
        >
          {{ isEdit() ? 'Update' : 'Save' }}
        </button>
      </div>
    </div>
  }

  <!-- Contacts List -->
  <div class="overflow-hidden bg-white border border-gray-200 rounded-xl">
    <div class="p-4 border-b border-gray-200">
      <h3 class="font-semibold text-gray-800">Contacts</h3>
    </div>

    <div class="divide-y">
      @for (c of filteredContacts(); track c.contactId) {
        <div class="flex justify-between items-center p-4 hover:bg-gray-50">
          <!-- Contact Info -->
          <div>
            <p class="font-medium text-gray-900">{{ c.name }}</p>
            <div class="flex flex-wrap gap-2 mt-1">
              @for (e of c.contactEmails; track $index) {
                <span class="text-xs bg-gray-100 px-2 py-1 rounded-full">
                  {{ e }}
                </span>
              }
            </div>
          </div>

          <!-- Actions -->
          <div class="flex gap-2">
            <button
              (click)="edit(c)"
              class="px-3 py-1.5 text-sm rounded-lg border hover:bg-gray-100"
            >
              Edit
            </button>
            <button
              (click)="delete(c)"
              class="px-3 py-1.5 text-sm rounded-lg text-red-600 hover:bg-red-50"
            >
              Delete
            </button>
          </div>
        </div>
      } @empty {
        <div class="p-6 text-center text-gray-500">No contacts found</div>
      }
    </div>
  </div>
</div>
